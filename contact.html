<!doctype html>
<html lang="en" class="no-js">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>MUTUMA Contact | Support</title>
    <meta name="description" content="Contact MUTUMA for orders, shipping and product support.">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="loading-screen" data-loader aria-hidden="true">
        <div class="loading-logo">MUTUMA</div>
    </div>
    <script src="js/loader.js?v=20260724a"></script>
    <header class="site-header" data-header></header>

    <main>
        <!-- Contact -->
        <section class="page-hero container">
            <span class="eyebrow">Contact</span>
            <h1>SUPPORT.</h1>
            <p>Order help, room advice and product questions.</p>
        </section>
        <section class="contact-layout container">
            <div class="contact-card">
                <h2>Studio Desk</h2>
                <p>hello@mutuma.example</p>
                <p>Monday to Friday / Worldwide support</p>
            </div>
            <form class="contact-form" data-contact-form>
                <label>Name<input required></label>
                <label>Email<input type="email" required></label>
                <label>Message<textarea required></textarea></label>
                <button class="button primary">Send Message</button>
            </form>
        </section>
    </main>

    <footer class="site-footer" data-footer></footer>
    <div data-modal></div>
    <script type="module" src="js/contact.js?v=20260725a"></script>
</body>
</html>
