[build]
    publish = "."
    functions = "netlify/functions"

[functions]
    node_bundler = "esbuild"

[[edge_functions]]
    path = "/currency-location"
    function = "currency-location"

[[redirects]]
    from = "/admin"
    to = "/admin.html"
    status = 200

[[redirects]]
    from = "/account"
    to = "/account.html"
    status = 200

[[redirects]]
    from = "/tracking"
    to = "/tracking.html"
    status = 200

[[redirects]]
    from = "/shop"
    to = "/shop.html"
    status = 200

[[redirects]]
    from = "/product"
    to = "/product.html"
    status = 200

[[redirects]]
    from = "/categories"
    to = "/categories.html"
    status = 200

[[headers]]
    for = "/*.html"
    [headers.values]
        Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
    for = "/css/*"
    [headers.values]
        Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
    for = "/js/*"
    [headers.values]
        Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
    for = "/images/*"
    [headers.values]
        Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"
