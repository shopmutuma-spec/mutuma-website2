<!doctype html>
<html lang="en" class="no-js">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>MUTUMA Order Tracking</title>
    <meta name="description" content="Track a MUTUMA order using your order number and checkout email.">
    <link rel="stylesheet" href="css/style.css?v=20260806e">
</head>
<body>
    <div class="loading-screen" data-loader aria-hidden="true"><div class="loading-logo">MUTUMA</div></div>
    <script src="js/loader.js?v=20260806e"></script>
    <header class="site-header" data-header></header>
    <main>
        <section class="page-hero container">
            <span class="eyebrow">Order Tracking</span>
            <h1>TRACK.</h1>
            <p>Enter your order number and checkout email.</p>
        </section>
        <section class="contact-layout container">
            <div class="contact-card">
                <h2>Tracking support</h2>
                <p>Tracking requires a connected order backend or carrier tracking API.</p>
                <p>If tracking is not available yet, contact MUTUMA with your order number and email.</p>
            </div>
            <form class="contact-form" data-tracking-form>
                <label>Order number<input name="orderNumber" autocomplete="off" required></label>
                <label>Customer email<input type="email" name="email" autocomplete="email" required></label>
                <button class="button primary">Check Order</button>
                <p class="form-message" data-tracking-message aria-live="polite"></p>
            </form>
        </section>
    </main>
    <footer class="site-footer" data-footer></footer>
    <div data-modal></div>
    <script type="module" src="js/tracking.js?v=20260806e"></script>
</body>
</html>
