<!doctype html>
<html lang="en" class="no-js">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>MUTUMA | Your Room. Your Culture.</title>
    <meta name="description" content="Premium room finds for street culture, gaming, music, anime and modern setup culture.">
    <link rel="preconnect" href="https://checkout.stripe.com" crossorigin>
    <link rel="preconnect" href="https://js.stripe.com" crossorigin>
    <link rel="stylesheet" href="css/style.css?v=20260902b">
    <link rel="modulepreload" href="js/main.js?v=20260902b">
    <link rel="modulepreload" href="js/ui.js?v=20260902b">
    <link rel="modulepreload" href="js/products.js?v=20260902b">
    <link rel="modulepreload" href="js/currency.js?v=20260902b">
    <script type="application/ld+json">
        {"@context":"https://schema.org","@type":"Store","name":"MUTUMA","slogan":"YOUR ROOM. YOUR CULTURE.","priceRange":"USD"}
    </script>
</head>
<body class="home-page redesigned-home">
    <div class="loading-screen" data-loader aria-hidden="true">
        <div class="loading-logo">MUTUMA</div>
    </div>
    <script src="js/ambient-theme.js?v=20260902b"></script>
    <script src="js/loader.js?v=20260902b"></script>
    <header class="site-header" data-header></header>

    <main>
        <!-- Trending -->
        <section class="section container home-section" id="trending" data-reveal>
            <div class="section-head">
                <div>
                    <span class="eyebrow">Trending now</span>
                    <h2>Trending.</h2>
                </div>
                <a href="shop.html?tag=trending">Shop trending</a>
            </div>
            <div class="product-grid premium-product-grid home-product-rail" data-trending-products></div>
        </section>

        <!-- Categories -->
        <section class="section container home-section" id="categories" data-reveal>
            <div class="section-head">
                <div>
                    <span class="eyebrow">Collections</span>
                    <h2>By room.</h2>
                </div>
                <a href="categories.html">View categories</a>
            </div>
            <div class="category-grid cinematic-category-grid" data-category-grid></div>
        </section>

        <!-- Shop the Room -->
        <section class="section container home-section" id="shop-room" data-room-section data-reveal></section>

        <!-- Best Sellers -->
        <section class="section container home-section" data-reveal>
            <div class="section-head">
                <div>
                    <span class="eyebrow">Best sellers</span>
                    <h2>Best sellers.</h2>
                </div>
                <a href="shop.html?tag=best-seller">Shop best sellers</a>
            </div>
            <div class="product-grid premium-product-grid home-product-rail" data-best-sellers></div>
        </section>

        <!-- Customer Favourites -->
        <section class="section container home-section" data-reveal>
            <div class="section-head">
                <div>
                    <span class="eyebrow">Customer favourites</span>
                    <h2>Favourites.</h2>
                </div>
                <a href="wishlist.html">Open wishlist</a>
            </div>
            <div class="product-grid premium-product-grid home-product-rail" data-customer-favourites></div>
        </section>

        <!-- New Arrivals + Limited Drops -->
        <section class="section container home-section split-showcase" data-reveal>
            <div class="home-split-panel">
                <span class="eyebrow">New arrivals</span>
                <h2>New in.</h2>
                <a class="button secondary" href="shop.html?sort=newest">Shop new in</a>
            </div>
            <div class="home-split-products" data-new-arrivals></div>
        </section>

        <section class="section container home-section limited-drop" data-reveal>
            <div>
                <span class="eyebrow">Limited drops</span>
                <h2>Drop energy.</h2>
            </div>
            <a class="button primary" href="shop.html?tag=new">Shop the drop</a>
        </section>

        <!-- Why MUTUMA -->
        <section class="about-section container why-mutuma" id="about" data-about data-reveal></section>

        <!-- Newsletter -->
        <section class="newsletter container home-newsletter" data-reveal>
            <div>
                <span class="eyebrow">Private drop list</span>
                <h2>Get the drops first.</h2>
            </div>
            <form name="mutuma-email-list" data-newsletter>
                <input type="hidden" name="form-name" value="mutuma-email-list">
                <input type="hidden" name="source" value="homepage-newsletter">
                <input type="email" name="email" placeholder="Email address" aria-label="Email address" required>
                <button class="button primary">Join</button>
            </form>
        </section>
    </main>

    <form name="mutuma-email-list" netlify netlify-honeypot="bot-field" hidden>
        <input type="hidden" name="form-name" value="mutuma-email-list">
        <input name="bot-field">
        <input type="email" name="email">
        <input name="source">
    </form>

    <footer class="site-footer" data-footer></footer>
    <div data-modal></div>
    <script type="module" src="js/main.js?v=20260902b"></script>
</body>
</html>
