<!doctype html>
<html lang="en" class="no-js">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>MUTUMA Account | Saved Room Finds</title>
    <meta name="description" content="Create or manage your MUTUMA customer account.">
    <link rel="stylesheet" href="css/style.css?v=20260902b">
</head>
<body>
    <div class="loading-screen" data-loader aria-hidden="true"><div class="loading-logo">MUTUMA</div></div>
    <script src="js/loader.js?v=20260902b"></script>
    <header class="site-header" data-header></header>

    <main>
        <section class="page-hero container">
            <span class="eyebrow">Account</span>
            <h1>SIGN IN.</h1>
            <p>Save your room finds and keep your shopping details close.</p>
        </section>
        <section class="account-layout container">
            <form class="contact-form" data-auth-form>
                <h2>Customer account</h2>
                <button class="button secondary google-auth-button" type="button" data-google-sign-in aria-label="Continue with Google">
                    <span class="google-mark" aria-hidden="true">
                        <svg viewBox="0 0 24 24">
                            <path fill="#4285F4" d="M21.6 12.23c0-.78-.07-1.53-.2-2.23H12v4.22h5.38a4.6 4.6 0 0 1-2 3.02v2.51h3.24c1.9-1.75 2.98-4.32 2.98-7.52Z"/>
                            <path fill="#34A853" d="M12 22c2.7 0 4.97-.9 6.62-2.44l-3.24-2.51c-.9.6-2.04.95-3.38.95-2.6 0-4.8-1.76-5.59-4.12H3.06v2.59A10 10 0 0 0 12 22Z"/>
                            <path fill="#FBBC05" d="M6.41 13.88A6 6 0 0 1 6.1 12c0-.65.11-1.28.31-1.88V7.53H3.06A10 10 0 0 0 2 12c0 1.61.39 3.14 1.06 4.47l3.35-2.59Z"/>
                            <path fill="#EA4335" d="M12 6c1.47 0 2.8.51 3.84 1.5l2.88-2.88C16.97 2.99 14.7 2 12 2a10 10 0 0 0-8.94 5.53l3.35 2.59C7.2 7.76 9.4 6 12 6Z"/>
                        </svg>
                    </span>
                    Continue with Google
                </button>
                <div class="auth-divider"><span>or use email</span></div>
                <label>Email<input type="email" name="email" autocomplete="email" required></label>
                <label>Password<input type="password" name="password" autocomplete="current-password" minlength="6" required></label>
                <div class="split-actions">
                    <button class="button primary" data-sign-in>Sign In</button>
                    <button class="button secondary" data-sign-up type="button">Create Account</button>
                </div>
                <p class="form-message" data-auth-message aria-live="polite"></p>
            </form>
            <section class="contact-card" data-account-panel>
                <h2>Your MUTUMA space</h2>
                <p>Sign in to connect your email with future account features. Wishlist and cart still work on this device without an account.</p>
            </section>
        </section>
    </main>

    <footer class="site-footer" data-footer></footer>
    <div data-modal></div>
    <script type="module" src="js/account.js?v=20260902b"></script>
</body>
</html>
